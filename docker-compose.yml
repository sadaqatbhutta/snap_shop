version: '3.8'

services:
  # Redis 7.x (required for BullMQ 5.x)
  redis:
    image: redis:7-alpine
    container_name: snapshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - snapshop-network

  # Main application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: snapshop-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN}
      - TIKTOK_API_BASE=${TIKTOK_API_BASE:-https://open.tiktokapis.com/v2}
      - TIKTOK_SEND_PATH=${TIKTOK_SEND_PATH:-/message/send/}
      - TIKTOK_WEBHOOK_SECRET=${TIKTOK_WEBHOOK_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_SERVICE_ACCOUNT_KEY=${FIREBASE_SERVICE_ACCOUNT_KEY}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - QUEUE_STRICT_MODE=${QUEUE_STRICT_MODE:-false}
      - INLINE_WORKERS_IN_SERVER=false
      - OBSERVABILITY_KEY=${OBSERVABILITY_KEY}
      - SMTP_API_URL=${SMTP_API_URL}
      - SMTP_API_KEY=${SMTP_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_GROWTH=${STRIPE_PRICE_GROWTH}
      - STRIPE_PRICE_SCALE=${STRIPE_PRICE_SCALE}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - snapshop-network

  # Background worker (separate process)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: snapshop-worker
    command: npm run worker
    environment:
      - NODE_ENV=staging
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_SERVICE_ACCOUNT_KEY=${FIREBASE_SERVICE_ACCOUNT_KEY}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN}
      - TIKTOK_API_BASE=${TIKTOK_API_BASE:-https://open.tiktokapis.com/v2}
      - TIKTOK_SEND_PATH=${TIKTOK_SEND_PATH:-/message/send/}
      - QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-5}
      - QUEUE_MAX_RETRIES=${QUEUE_MAX_RETRIES:-3}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - snapshop-network

volumes:
  redis-data:
    driver: local

networks:
  snapshop-network:
    driver: bridge
